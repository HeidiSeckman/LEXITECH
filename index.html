<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LEXITECH // Cyber-Forensic Legal & Tax AI Studio</title>
<link rel="icon" type="image/png" href="LEXItech.PNG" />
<link href="https://googleapis.com" rel="stylesheet" />
<style>
  :root { --bg:#12070E; --card:rgba(36,16,28,0.82); --pink:#FF2A85; --rose:#F9A8D4; --border:rgba(255,42,133,0.34); --text:#FFF5FA; --muted:#E5C1D3; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:radial-gradient(circle at 50% 14%, #331126 0%, #160811 55%, #0D040A 100%); color:var(--text); font-family:'Plus Jakarta Sans',sans-serif; min-height:100vh; overflow-x:hidden; position:relative; }
  .tech-bg { position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:0; }
  .wrap { max-width:1160px; margin:0 auto; padding:26px 22px 48px; position:relative; z-index:2; }
  .topbar { display:flex; justify-content:space-between; align-items:center; background:var(--card); border:1px solid var(--border); backdrop-filter:blur(16px); border-radius:16px; padding:12px 22px; margin-bottom:26px; box-shadow:0 8px 28px rgba(0,0,0,0.35); }
  .brand { display:flex; align-items:center; gap:14px; font-weight:800; font-size:25px; letter-spacing:-0.02em; }
  .logo-badge { width:54px; height:54px; border-radius:14px; background:radial-gradient(circle, rgba(255,42,133,0.25) 0%, rgba(18,7,14,0.92) 100%); border:1.5px solid var(--border); overflow:hidden; display:flex; align-items:center; justify-content:center; box-shadow:0 0 18px rgba(255,42,133,0.35); }
  .logo-badge img { width:135%; height:135%; object-fit:cover; object-position:center 34%; }
  .brand span { color:var(--pink); }
  .nav-links { display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .pill { font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:700; color:var(--rose); border:1px solid var(--border); background:rgba(255,42,133,0.12); padding:6px 14px; border-radius:999px; text-decoration:none; }
  .hero { display:grid; grid-template-columns:1.25fr 0.75fr; align-items:center; gap:28px; background:var(--card); border:1px solid var(--border); backdrop-filter:blur(16px); border-radius:22px; padding:34px 38px; margin-bottom:24px; box-shadow:0 16px 42px rgba(0,0,0,0.4); }
  @media (max-width:860px) { .hero { grid-template-columns:1fr; text-align:center; padding:26px 22px; } }
  .hero h1 { font-size:clamp(28px,4vw,44px); font-weight:800; line-height:1.12; margin:12px 0 14px; }
  .hero h1 span { color:var(--pink); }
  .hero p { color:var(--muted); font-size:15.5px; line-height:1.62; margin-bottom:22px; }
  .hero-actions { display:flex; gap:12px; flex-wrap:wrap; }
  @media (max-width:860px) { .hero-actions { justify-content:center; } }
  .globe-wrap { display:flex; flex-direction:column; align-items:center; justify-content:center; }
  canvas#sphere { display:block; filter:drop-shadow(0 0 26px rgba(255,42,133,0.8)); }
  .metrics { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:16px; margin-bottom:28px; }
  .metric-box { background:var(--card); border:1px solid var(--border); backdrop-filter:blur(12px); border-radius:14px; padding:16px 20px; }
  .metric-val { font-family:'JetBrains Mono',monospace; font-size:20px; font-weight:700; color:var(--pink); margin-bottom:4px; }
  .metric-lbl { font-size:12.5px; color:var(--muted); }
  .sec-head { display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:16px; flex-wrap:wrap; gap:10px; }
  .sec-head h2 { font-size:24px; font-weight:800; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(310px,1fr)); gap:22px; margin-bottom:32px; }
  .card { background:var(--card); border:1px solid var(--border); border-top:3px solid var(--pink); backdrop-filter:blur(16px); border-radius:18px; padding:26px; display:flex; flex-direction:column; justify-content:space-between; transition:transform .2s,box-shadow .2s; box-shadow:0 10px 30px rgba(0,0,0,0.3); }
  .card:hover { transform:translateY(-4px); box-shadow:0 16px 38px rgba(255,42,133,0.24); }
  .mod { font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:700; color:var(--rose); margin-bottom:8px; letter-spacing:0.06em; }
  .card h3 { font-size:20px; margin-bottom:10px; }
  .card p { color:var(--muted); font-size:14px; line-height:1.58; margin-bottom:16px; }
  .feat-list { list-style:none; margin-bottom:22px; display:flex; flex-direction:column; gap:7px; }
  .feat-list li { font-size:13px; color:#FCE7F3; display:flex; align-items:center; gap:8px; }
  .feat-list li::before { content:"◆"; color:var(--pink); font-size:10px; }
  .btn { display:inline-block; text-align:center; text-decoration:none; background:linear-gradient(135deg,#E11D74 0%,#88134D 100%); color:#FFF; font-weight:700; font-size:14px; padding:12px 24px; border-radius:999px; border:1px solid #F9A8D4; box-shadow:0 6px 20px rgba(225,29,116,0.35); transition:all .2s; cursor:pointer; }
  .btn:hover { transform:translateY(-2px); box-shadow:0 10px 26px rgba(225,29,116,0.55); }
  .btn-ghost { background:transparent; border:1.5px solid var(--rose); color:var(--rose); box-shadow:none; }
  .btn-ghost:hover { background:rgba(255,42,133,0.16); color:#FFF; }
  .vault-bar { background:linear-gradient(135deg,rgba(46,16,35,0.92) 0%,rgba(26,9,20,0.96) 100%); border:1.5px solid var(--pink); backdrop-filter:blur(16px); border-radius:20px; padding:24px 30px; display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:20px; box-shadow:0 14px 38px rgba(255,42,133,0.24); }
  .vault-info { flex:1 1 340px; }
  .vault-info h2 { font-size:22px; font-weight:800; margin:4px 0 6px; }
  .vault-info p { color:var(--muted); font-size:13.8px; line-height:1.5; }
  .vault-form { flex:1 1 420px; display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:flex-end; }
  .vault-input { background:rgba(255,255,255,0.08); border:1.5px solid var(--border); color:#FFF; border-radius:999px; padding:12px 18px; font-size:14px; font-family:inherit; min-width:200px; flex:1; outline:none; }
  .vault-input::placeholder { color:#D4A5BD; }
  .vault-input:focus { border-color:var(--pink); background:rgba(255,255,255,0.12); }
  footer { text-align:center; color:var(--muted); font-size:12.5px; margin-top:32px; padding-top:20px; border-top:1px solid var(--border); line-height:1.6; }
</style>
</head>
